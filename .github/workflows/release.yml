# Release, step 1: Actions tab -> "Release" -> Run workflow, pick patch / minor / major.
#   - raises project(pico_radio VERSION x.y.z) in CMakeLists.txt
#   - adds the changes since the last release (from the commit messages)
#     to CHANGELOG.md
#   - pushes that as branch release/vX.Y.Z and opens a pull request,
#     and starts the Build workflow on it (the required "build" check)
# Step 2 is yours: merge the pull request. publish.yml then tags the merge
# commit, builds it and publishes the GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write        # push the release branch
  pull-requests: write   # open the pull request
  actions: write         # start the Build workflow on it

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out (full history for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          cur=$(sed -nE 's/^project\(pico_radio VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          [ -n "$cur" ] || { echo "version not found in CMakeLists.txt"; exit 1; }
          IFS=. read -r major minor patch <<< "$cur"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "tag v$new already exists"; exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/v$new" >/dev/null; then
            echo "branch release/v$new already exists: merge or delete its pull request first"; exit 1
          fi
          sed -i -E "s/^(project\(pico_radio VERSION )[0-9]+\.[0-9]+\.[0-9]+/\1$new/" CMakeLists.txt
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "Version $cur -> $new"

      - name: Changelog
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          scripts/changelog.sh "$prev" "${{ steps.bump.outputs.version }}" > release_notes.md
          cat release_notes.md
          { cat release_notes.md; echo; if [ -f CHANGELOG.md ]; then sed '1{/^# Changelog/d}' CHANGELOG.md; fi; } > new_changelog.md
          { echo "# Changelog"; echo; cat new_changelog.md; } | cat -s > CHANGELOG.md
          rm new_changelog.md

      - name: Push the release branch and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CMakeLists.txt CHANGELOG.md
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          {
            echo "Merging this publishes **Pico Radio $VERSION** (tag \`v$VERSION\`, firmware files attached to the release)."
            echo
            cat release_notes.md
          } > pr_body.md
          gh pr create --base "$BASE" --head "$branch" --title "Release v$VERSION" --body-file pr_body.md
          # pushes made with the workflow token don't start other workflows,
          # so start the build (the required "build" check) explicitly
          gh workflow run build.yml --ref "$branch"

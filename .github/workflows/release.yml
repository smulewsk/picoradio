# Release: Actions tab -> "Release" -> Run workflow, pick patch / minor / major.
#   1. bumps project(pico_radio VERSION x.y.z) in CMakeLists.txt
#   2. writes the changes since the last release (from the commit messages)
#      to CHANGELOG.md
#   3. commits "Release vX.Y.Z", tags it vX.Y.Z and pushes both
#   4. builds that commit and publishes a GitHub release with the firmware
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Check out (full history for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          cur=$(sed -nE 's/^project\(pico_radio VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          [ -n "$cur" ] || { echo "version not found in CMakeLists.txt"; exit 1; }
          IFS=. read -r major minor patch <<< "$cur"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "tag v$new already exists"; exit 1
          fi
          sed -i -E "s/^(project\(pico_radio VERSION )[0-9]+\.[0-9]+\.[0-9]+/\1$new/" CMakeLists.txt
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "Version $cur -> $new"

      - name: Changelog
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          scripts/changelog.sh "$prev" "${{ steps.bump.outputs.version }}" > release_notes.md
          cat release_notes.md
          { cat release_notes.md; echo; if [ -f CHANGELOG.md ]; then sed '1{/^# Changelog/d}' CHANGELOG.md; fi; } > new_changelog.md
          { echo "# Changelog"; echo; cat new_changelog.md; } | cat -s > CHANGELOG.md
          rm new_changelog.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt CHANGELOG.md
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Pico Radio ${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}" "${{ steps.bump.outputs.tag }}"

      - name: Keep the release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  build:
    needs: bump
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.tag }}

  publish:
    needs: [bump, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          cd firmware
          mv pico_radio.uf2 "pico_radio-$VERSION.uf2"
          mv pico_radio.bin "pico_radio-$VERSION.bin"
          mv pico_radio.elf "pico_radio-$VERSION.elf"
          {
            cat ../release_notes.md
            echo
            echo "### Files"
            echo "- \`pico_radio-$VERSION.uf2\`: the firmware. Upload it on the radio's web page (Firmware card) or copy it onto the RP2350 drive in BOOTSEL mode."
            echo "- \`pt.uf2\`: partition table, only needed once before the first USB install (see the README)."
            echo "- \`pico_radio-$VERSION.bin\` / \`.elf\`: the same firmware for OTA by \`curl\` or debugging."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pico Radio $VERSION" \
            --notes-file notes.md \
            "pico_radio-$VERSION.uf2" pt.uf2 "pico_radio-$VERSION.bin" "pico_radio-$VERSION.elf"
